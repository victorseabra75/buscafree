name: Deploy BuscaFri

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Install Python & Dependencies
        run: uv sync --dev
          
      - name: Run Linter
        run: uv run ruff check .
          
      - name: Run Tests
        run: uv run pytest tests/
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: victor_seabra_ba
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/buscafri
            # Adiciona o uv ao PATH explicitamente
            export PATH="$HOME/.local/bin:$PATH"
            
            git pull origin main
            uv sync
            
            # Reinicia os serviços usando o systemctl do usuário (ou sem pedir senha)
            sudo systemctl restart buscafri-api
            sudo systemctl restart buscafri-streamlit